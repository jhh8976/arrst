<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K9 Prompt Builder | 다중선택</title><style>

</style></head><body><header><h1>K9 Prompt Builder</h1><p>10개 구조 · 200개 키워드 · 구조별 다중선택 · 실시간 프롬프트 조합</p></header><main class="layout"><section class="panel"><div class="rowhead"><h2>키워드 선택</h2><button id="reset">전체 초기화</button></div><p class="muted">각 구조를 펼쳐 체크박스를 여러 개 선택하세요. 선택된 항목은 모두 프롬프트에 반영됩니다.</p><div id="groups"></div></section><aside class="panel right"><h2>생성된 프롬프트</h2><p id="selectionSummary" class="summary"></p><textarea id="prompt" spellcheck="false" aria-label="생성된 프롬프트"></textarea><div class="actions"><button class="primary" id="copy">복사</button><button id="txt">TXT 저장</button><button id="md">Markdown 저장</button><button id="random">무작위 조합</button><button id="regenerate">선택값으로 재생성</button></div><p id="toast" aria-live="polite"></p><p class="muted">출력된 프롬프트는 직접 수정할 수 있습니다. 선택 키워드를 변경하면 편집 내용 대신 새 프롬프트가 생성됩니다. 상충하는 구도·화면비율 등을 동시에 선택하면 결과가 불안정할 수 있습니다.</p></aside></main><script>

t", "자연광"], ["Golden Hour", "황금빛 시간대"], ["Blue Hour", "푸른빛 시간대"], ["Soft Diffused Lighting", "부드러운 확산광"], ["Dramatic Lighting", "극적인 조명"], ["Cinematic Backlighting", "영화 같은 역광"], ["Side Lighting", "측면 조명"], ["Front Lighting", "정면 조명"], ["Overcast Lighting", "흐린 날의 균일한 조명"], ["High Contrast Lighting", "높은 명암 대비"], ["Low-Key Lighting", "어둡고 무게감 있는 조명"], ["High-Key Lighting", "밝고 균일한 조명"], ["Volumetric Lighting", "입체적인 광선 표현"], ["Rim Lighting", "외곽 윤곽 조명"], ["Studio Lighting", "스튜디오 조명"], ["Industrial Lighting", "산업시설 조명"], ["Moonlight Illumination", "달빛 조명"], ["Dawn Lighting", "새벽 조명"], ["Sunset Lighting", "석양 조명"], ["HDR Lighting", "넓은 명암 표현"]]}, {"name": "Style · 스타일", "items": [["Photorealistic", "초현실적 사진 스타일"], ["Cinematic", "영화적 스타일"], ["Documentary Photography", "다큐멘터리 사진"], ["Military Photography", "군사 전문 사진"], ["Industrial Photography", "산업 전문 사진"], ["Product Photography", "제품 홍보 사진"], ["Hyperrealism", "극사실주의"], ["3D Product Rendering", "3D 제품 렌더링"], ["Unreal Engine Style", "언리얼 엔진풍 렌더링"], ["Technical Illustration", "기술 일러스트"], ["Engineering Visualization", "공학 시각화"], ["Blueprint Style", "설계도 스타일"], ["Concept Art", "콘셉트 아트"], ["Digital Painting", "디지털 페인팅"], ["Matte Painting", "매트 페인팅"], ["Isometric Illustration", "아이소메트릭 일러스트"], ["Minimalist Design", "미니멀 디자인"], ["Monochrome Photography", "단색 사진"], ["Vintage Military Photography", "빈티지 군사 사진"], ["Futuristic Military Art", "미래형 군사 아트"]]}, {"name": "Constraints · 제외", "items": [["Deformed Barrel", "왜곡된 포신"], ["Bent Cannon", "휘어진 포신"], ["Extra Barrels", "불필요한 추가 포신"], ["Duplicate Turrets", "중복된 포탑"], ["Broken Tracks", "끊어진 궤도"], ["Extra Wheels", "불필요한 바퀴"], ["Missing Road Wheels", "누락된 보기륜"], ["Incorrect Proportions", "비정상적인 비례"], ["Floating Vehicle", "공중에 떠 있는 차량"], ["Toy-Like Appearance", "장난감 같은 외형"], ["Cartoon Style", "만화풍"], ["Low-Poly Model", "저폴리곤 모델"], ["Blurry Image", "흐릿한 이미지"], ["Pixelated Texture", "픽셀화된 질감"], ["Distorted Perspective", "왜곡된 원근감"], ["Excessive Motion Blur", "과도한 움직임 흐림"], ["Unrealistic Reflections", "비현실적인 반사"], ["Text Overlay", "이미지 위 문자"], ["Watermark", "워터마크"], ["Oversaturated Colors", "과도한 색상 채도"]]}, {"name": "Output · 출력", "items": [["16:9 Aspect Ratio", "와이드 화면"], ["4:3 Aspect Ratio", "표준 가로 화면"], ["1:1 Aspect Ratio", "정사각형 화면"], ["9:16 Aspect Ratio", "세로형 화면"], ["3:2 Aspect Ratio", "사진형 화면"], ["21:9 Ultrawide", "초광각 화면"], ["High Resolution", "고해상도"], ["Ultra High Definition", "초고화질"], ["4K Detail", "4K 수준의 디테일"], ["8K Detail", "8K 수준의 디테일"], ["Sharp Focus", "선명한 초점"], ["Fine Surface Detail", "정교한 표면 표현"], ["High Dynamic Range", "넓은 명암 범위"], ["Realistic Texture", "사실적인 질감"], ["Crisp Edges", "선명한 윤곽"], ["Clean Background", "깔끔한 배경"], ["Shallow Depth of Field", "얕은 피사계 심도"], ["Deep Depth of Field", "깊은 피사계 심도"], ["Professional Image Quality", "전문가급 이미지 품질"], ["Print-Ready Composition", "인쇄에 적합한 구도"]]}, {"name": "Validation · 검증", "items": [["Model Accuracy", "실제 모델과의 일치성"], ["Structural Consistency", "구조적 일관성"], ["Barrel Alignment", "포신 정렬 상태"], ["Turret Geometry", "포탑 형상"], ["Track Geometry", "궤도 구조"], ["Wheel Alignment", "보기륜 정렬"], ["Vehicle Proportions", "차량 비례"], ["Material Realism", "재질의 사실성"], ["Camouflage Consistency", "위장도색 일관성"], ["Lighting Consistency", "조명 일관성"], ["Shadow Accuracy", "그림자의 자연스러움"], ["Perspective Accuracy", "원근감 정확성"], ["Background Coherence", "배경과 대상의 조화"], ["Detail Consistency", "세부 표현의 일관성"], ["Object Completeness", "장비 전체의 완전성"], ["Photographic Realism", "사진적 사실성"], ["Composition Balance", "화면 구성의 균형"], ["Color Harmony", "색상 조화"], ["Artifact Detection", "생성 오류 확인"], ["Reference Similarity", "참고 이미지와의 유사성"]]}];
const state=DATA.map(()=>new Set());
const groups=document.getElementById('groups'), promptBox=document.getElementById('prompt');
const join=(a)=>a.join(', ');
function render(){groups.innerHTML='';DATA.forEach((g,i)=>{let d=document.createElement('details');d.className='group';if(i<2)d.open=true;let s=document.createElement('summary');s.innerHTML=`<span>${String(i+1).padStart(2,'0')} · ${g.name}</span><span class="count" id="count${i}">0개 선택</span>`;d.append(s);let inner=document.createElement('div');inner.className='inner';let search=document.createElement('input');search.className='search';search.placeholder='한국어 또는 영어 키워드 검색';search.setAttribute('aria-label',g.name+' 검색');inner.append(search);let tools=document.createElement('div');tools.className='tools';for(let [title,fn] of [['전체 선택',()=>{g.items.forEach((_,j)=>state[i].add(j));refreshChecks();}],['전체 해제',()=>{state[i].clear();refreshChecks();}],['검색 결과 선택',()=>{g.items.forEach((p,j)=>{if(p.join(' ').toLowerCase().includes(search.value.toLowerCase()))state[i].add(j)});refreshChecks();}]]){let b=document.createElement('button');b.textContent=title;b.type='button';b.addEventListener('click',fn);tools.append(b)}inner.append(tools);let opts=document.createElement('div');opts.className='options';const refreshChecks=()=>{opts.querySelectorAll('input').forEach(x=>x.checked=state[i].has(Number(x.value)));update()};g.items.forEach((p,j)=>{let lab=document.createElement('label');lab.className='opt';lab.dataset.search=p.join(' ').toLowerCase();let ch=document.createElement('input');ch.type='checkbox';ch.value=j;ch.checked=state[i].has(j);ch.addEventListener('change',()=>{if(ch.checked)state[i].add(j);else state[i].delete(j);update()});let t=document.createElement('span');t.textContent=p[1];let small=document.createElement('small');small.textContent=p[0];t.append(small);lab.append(ch,t);opts.append(lab)});search.addEventListener('input',()=>opts.querySelectorAll('label').forEach(el=>el.hidden=!el.dataset.search.includes(search.value.toLowerCase())));inner.append(opts);d.append(inner);groups.append(d)});update()}
function get(i){return [...state[i]].sort((a,b)=>a-b).map(j=>DATA[i].items[j][0])}
function build(){let x=DATA.map((_,i)=>get(i));let lines=[];if(x[0].length)lines.push('Act as '+join(x[0].map(v=>'a professional '+v))+'.');if(x[1].length)lines.push('Create a detailed image featuring '+join(x[1])+'.');if(x[2].length)lines.push('Vehicle details: '+join(x[2])+'.');if(x[3].length)lines.push('Environment: '+join(x[3])+'.');if(x[4].length)lines.push('Camera and composition: '+join(x[4])+'.');if(x[5].length)lines.push('Lighting: '+join(x[5])+'.');if(x[6].length)lines.push('Visual style: '+join(x[6])+'.');if(x[7].length)lines.push('Avoid: '+join(x[7])+'.');if(x[8].length)lines.push('Output requirements: '+join(x[8])+'.');if(x[9].length)lines.push('Validate: '+join(x[9])+'.');return lines.join('\n\n')||'왼쪽에서 키워드를 선택하세요.'}
function update(){DATA.forEach((g,i)=>{let el=document.getElementById('count'+i);if(el)el.textContent=state[i].size+'개 선택'});let total=state.reduce((n,s)=>n+s.size,0);document.getElementById('selectionSummary').textContent=`총 ${total}개 키워드 선택됨`;promptBox.value=build()}
function toast(t){document.getElementById('toast').textContent=t}
async function copy(){try{await navigator.clipboard.writeText(promptBox.value);toast('복사 완료')}catch(e){promptBox.focus();promptBox.select();let ok=document.execCommand('copy');toast(ok?'복사 완료':'복사할 텍스트를 선택했습니다. Ctrl+C를 눌러주세요.')}}
function save(ext){let content=ext==='md'?'# K9 이미지 생성 프롬프트\n\n```text\n'+promptBox.value+'\n```\n':promptBox.value;let blob=new Blob([content],{type:'text/plain;charset=utf-8'});let a=document.createElement('a');let url=URL.createObjectURL(blob);a.href=url;a.download='K9_prompt_'+new Date().toISOString().slice(0,10)+'.'+ext;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast(ext.toUpperCase()+' 파일 저장 시작')}
document.getElementById('copy').onclick=copy;document.getElementById('txt').onclick=()=>save('txt');document.getElementById('md').onclick=()=>save('md');document.getElementById('reset').onclick=()=>{state.forEach(s=>s.clear());render();toast('초기화 완료')};document.getElementById('random').onclick=()=>{state.forEach((s,i)=>{s.clear();let n=1+Math.floor(Math.random()*3);while(s.size<n)s.add(Math.floor(Math.random()*DATA[i].items.length))});render();toast('무작위 키워드 조합 완료')};document.getElementById('regenerate').onclick=()=>{update();toast('선택값으로 재생성 완료')};
state[0].add(0);state[1].add(0);state[2].add(0);state[3].add(0);state[4].add(3);state[5].add(1);state[6].add(0);state[7].add(0);state[8].add(0);state[9].add(1);render();
</script></body></html>
